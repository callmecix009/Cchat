name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Review PR with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const { context, getOctokit } = require('@actions/github');
            const core = require('@actions/core');

            const octokit = getOctokit(process.env.GITHUB_TOKEN);
            const pr = context.payload.pull_request;

            const files = await octokit.paginate(octokit.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const diff = files
              .map(f => `FILE: ${f.filename}\n${f.patch || ''}`)
              .join('\n\n')
              .slice(0, 25000);

            const prompt = `
You are MASTER99, an expert AI code reviewer.
Review the following pull request diff and point out real issues.
For each issue, include:
1. What to fix
2. Why it matters
3. Copy-paste fix snippet

Start every review response with: "🤖 **MASTER99 Review:**"
End with: "- **MASTER99**"

Diff:
${diff}
`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!res.ok || !text) {
              throw new Error(`Gemini API failed: ${JSON.stringify(data)}`);
            }

            await octokit.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: 'COMMENT',
              body: `🤖 **MASTER99 Review:**\n\n${text}\n\n- **MASTER99**`
            });

            core.info('PR review posted successfully.');
