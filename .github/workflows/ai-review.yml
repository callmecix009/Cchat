name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Review PR with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const repo = process.env.REPO;
          const prNumber = process.env.PR_NUMBER;
          const githubToken = process.env.GITHUB_TOKEN;
          const geminiKey = process.env.GEMINI_API_KEY;

          const headers = {
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "master99-review"
          };

          async function ghFetch(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                ...headers,
                ...(options.headers || {}),
                Authorization: `Bearer ${githubToken}`,
              },
            });

            const text = await response.text();
            let data;

            try {
              data = text ? JSON.parse(text) : {};
            } catch {
              data = text;
            }

            if (!response.ok) {
              throw new Error(`GitHub API error (${response.status}): ${JSON.stringify(data)}`);
            }

            return data;
          }

          async function main() {
            const files = await ghFetch(`/repos/${repo}/pulls/${prNumber}/files?per_page=100`);
            const diffText = files
              .map(file => {
                const filename = file.filename || "unknown";
                const patch = file.patch || "";
                return `FILE: ${filename}\n${patch}`;
              })
              .join("\n\n")
              .slice(0, 25000);

            const prompt = `
You are MASTER99, an expert AI code reviewer.

Review the following pull request diff and provide concise but actionable feedback.
Focus on real bugs, code quality issues, security concerns, and maintainability problems.

For every issue found:
1. What to fix
2. Why it matters
3. Copy-paste fix snippet

Requirements:
- Always identify yourself as MASTER99.
- Start every review response with: "🤖 **MASTER99 Review:**"
- End with: "- **MASTER99**"
- Keep feedback professional and specific.
- Do not invent issues that are not supported by the diff.
- If no issue is found, say so plainly.

PR diff:
${diffText}
`;

            const geminiResponse = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  contents: [
                    {
                      parts: [{ text: prompt }],
                    },
                  ],
                }),
              }
            );

            const geminiData = await geminiResponse.json();
            const reviewText =
              geminiData?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!geminiResponse.ok || !reviewText) {
              throw new Error(`Gemini API error: ${JSON.stringify(geminiData)}`);
            }

            await ghFetch(`/repos/${repo}/pulls/${prNumber}/reviews`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                event: "COMMENT",
                body: `🤖 **MASTER99 Review:**\n\n${reviewText}\n\n- **MASTER99**`,
              }),
            });

            console.log("Review posted successfully.");
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
